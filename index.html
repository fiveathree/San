<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>三國亂世錄</title>
<meta name="description" content="瀏覽器三國策略遊戲：以任何武將身分出發，在野、仕官、太守、主公皆可。">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 版面：整頁固定一屏，不捲動。左為青綠設色輿圖（可拖曳），右為政令卷分頁；清單按高度自動分頁 */
:root{
  --paper:#e7ebe0; --panel:#f4f6ef; --ink:#1d231e; --muted:#5d695f; --line:#c2cbbd;
  --seal:#ad2a1f; --seal-ink:#fff8f0; --gold:#8a6a1c;
  --land:#dbe3cf; --land2:#cbd6bd; --sea:#b4c9c6; --river:#7ea3a5; --road:#9f9a83;
  --good:#2d7a4c; --bad:#ad2a1f; --shade:rgba(20,28,24,.55);
  --font-d:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --font-b:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#131a1a; --panel:#1a2222; --ink:#e2e6dc; --muted:#98a49b; --line:#334140;
  --seal:#d9473b; --seal-ink:#fff8f0; --gold:#d2b468;
  --land:#1c2725; --land2:#22302c; --sea:#0e1618; --river:#2e575a; --road:#5d6457;
  --good:#5cb882; --bad:#e2675b; --shade:rgba(0,0,0,.65); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#131a1a; --panel:#1a2222; --ink:#e2e6dc; --muted:#98a49b; --line:#334140;
  --seal:#d9473b; --seal-ink:#fff8f0; --gold:#d2b468;
  --land:#1c2725; --land2:#22302c; --sea:#0e1618; --river:#2e575a; --road:#5d6457;
  --good:#5cb882; --bad:#e2675b; --shade:rgba(0,0,0,.65); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 var(--font-b);-webkit-text-size-adjust:100%;overscroll-behavior:none}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
h1,h2,h3{font-family:var(--font-d);font-weight:700;margin:0;text-wrap:balance;line-height:1.3}
h2{font-size:19px} h3{font-size:15px}
h3 small{font:400 13px var(--font-b);color:var(--muted);margin-left:6px}
button{font:inherit;color:inherit}
p{margin:0}
.muted{color:var(--muted)} .ink{color:var(--ink)}
.num{font-variant-numeric:tabular-nums}
.btn{font-family:var(--font-d);font-weight:700;border:1px solid var(--ink);background:transparent;padding:5px 13px;border-radius:2px;cursor:pointer;letter-spacing:.08em;min-height:34px}
.btn:hover:not(:disabled){background:var(--ink);color:var(--paper)}
.btn:focus-visible,.city:focus-visible,input:focus-visible,.trow:focus-visible,.orow:focus-visible{outline:2px solid var(--seal);outline-offset:1px}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn.primary{background:var(--seal);border-color:var(--seal);color:var(--seal-ink)}
.btn.primary:hover:not(:disabled){filter:brightness(1.1);background:var(--seal);color:var(--seal-ink)}
.btn.small{padding:2px 9px;min-height:30px;font-size:13px}
.btn small{font-family:var(--font-b);font-weight:400;opacity:.7}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.wrap{padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.label{font-size:12px;letter-spacing:.18em;color:var(--muted);font-weight:700}
.dot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.tag{display:inline-block;font-size:11px;padding:0 5px;border:1px solid currentColor;border-radius:2px;line-height:17px;letter-spacing:.04em}
.tag.lord{color:var(--seal)} .tag.gov{color:var(--gold)} .tag.free{color:var(--muted)}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:transparent;padding:3px 10px;cursor:pointer;border-radius:2px;font-size:13px}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* 分頁清單 */
.plist{flex:1;min-height:0;display:flex;flex-direction:column}
.pl-body{flex:1;min-height:0;overflow:hidden}
.pl-nav{flex:none;height:34px;display:flex;justify-content:center;align-items:center;gap:12px;font-size:13px}
.pg{border:1px solid var(--line);background:transparent;padding:0 12px;height:28px;cursor:pointer;border-radius:2px}
.pg:disabled{opacity:.35;cursor:default}
.orow{display:grid;grid-template-columns:minmax(0,1fr) repeat(5,26px);gap:4px;align-items:center;height:30px;padding:0 4px;border:0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;cursor:pointer;background:none;text-align:left;width:100%}
.orow:hover{background:var(--land)}
.orow.head{cursor:default;color:var(--muted);font-size:12px;flex:none}
.orow.head:hover{background:none}
.orow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.orow.done .nm{color:var(--muted)}
.orow > span:not(.nm){text-align:right}
.lrow{display:grid;grid-template-columns:5.6em minmax(0,1fr);gap:8px;height:44px;align-items:center;border-bottom:1px solid var(--line);font-size:13px}
.lrow time{color:var(--muted);font-variant-numeric:tabular-nums}
.lrow span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lrow.me span{color:var(--seal)}

/* 標題畫面 */
.title{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;max-width:1100px;width:100%;margin:0 auto;padding-block:14px 10px}
.title-head{display:flex;gap:12px;align-items:center;flex-wrap:wrap;flex:none}
.big-seal{font:900 clamp(20px,3.4vw,30px)/1 var(--font-d);background:var(--seal);color:var(--seal-ink);padding:8px 10px;letter-spacing:.1em;border-radius:3px}
.title-head h1{font-size:clamp(22px,3.2vw,32px)}
.title-head p{flex:1;min-width:220px;max-width:46ch}
.scen{display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:none}
.scen button{text-align:left;border:1px solid var(--line);background:var(--panel);padding:9px 13px;cursor:pointer;border-radius:2px;display:grid;gap:2px}
.scen button[aria-pressed="true"]{border-color:var(--seal);box-shadow:inset 4px 0 0 var(--seal)}
.scen b{font-family:var(--font-d);font-size:17px}
.scen .desc{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tctl{flex:none}
.tctl input[type=search]{flex:1;min-width:140px;padding:6px 10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:2px;font:inherit}
.listbox{flex:1;min-height:0;display:flex;flex-direction:column;border:1px solid var(--line);background:var(--panel)}
.trow{display:grid;grid-template-columns:5.6em 3.4em minmax(0,1fr) repeat(5,2.8em) 2.6em;gap:4px;align-items:center;height:31px;padding:0 10px;border:0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap;cursor:pointer;background:none;text-align:left;width:100%}
.trow > *{overflow:hidden;text-overflow:ellipsis}
.trow.head{cursor:default;font-size:12px;color:var(--muted);flex:none}
.trow.head button{border:0;background:none;padding:0;cursor:pointer;color:inherit;text-align:left}
.trow.on{background:var(--land2)}
.trow:hover:not(.head){background:var(--land)}
.tstart{flex:none}

/* 遊戲畫面 */
.bar{flex:none;background:var(--panel);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;padding-block:6px}
.date{font-family:var(--font-d);font-weight:900;font-size:17px;letter-spacing:.04em}
.who{display:flex;align-items:center;gap:7px;min-width:0}
.mini-seal{font-family:var(--font-d);font-weight:700;background:var(--seal);color:var(--seal-ink);padding:1px 7px;border-radius:2px;letter-spacing:.08em;white-space:nowrap}
.ap{display:flex;align-items:center;gap:6px}
.ap i{display:block;width:80px;height:8px;background:var(--line);border-radius:1px;overflow:hidden}
.ap i b{display:block;height:100%;background:var(--seal)}
.spacer{flex:1}
.game{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 380px}
.mapcol{min-width:0;min-height:0;display:flex;flex-direction:column;gap:6px;padding:8px}
.mapbox{flex:1;min-height:0;position:relative;border:1px solid var(--line);background:var(--land);overflow:hidden}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.ticker{list-style:none;margin:0;padding:0 2px;flex:none;font-size:13px}
.ticker li{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ticker time{color:var(--muted);margin-right:8px}
.cstrip{display:none}
.side{min-width:0;min-height:0;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column}
.stabs,.mnav{display:flex;flex:none}
.stabs{border-bottom:1px solid var(--line)}
.stabs button,.mnav button{flex:1;border:0;background:transparent;padding:8px 0;cursor:pointer;font:700 14px var(--font-d);letter-spacing:.15em;color:var(--muted);border-bottom:3px solid transparent}
.stabs button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--seal)}
.pane{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding-block:10px}
.sec{display:flex;flex-direction:column;gap:6px;flex:none}
.sec.grow{flex:1;min-height:0}
.sec h3{border-bottom:1px solid var(--line);padding-bottom:3px}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;text-align:center}
.stats div{border:1px solid var(--line);padding:1px 0;line-height:1.25}
.stats small{display:block;color:var(--muted);font-size:11px}
.stats b{font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px;font-variant-numeric:tabular-nums}
.kv div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dotted var(--line)}
.kv span{color:var(--muted)}
.acts{display:flex;flex-wrap:wrap;gap:6px}
.note{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mnav{display:none}
@media (min-width:900px){.m-only{display:none!important}}
@media (max-width:899px){
  .game{grid-template-columns:minmax(0,1fr)}
  .game[data-view="map"] .side{display:none}
  .game:not([data-view="map"]) .mapcol{display:none}
  .side{border-left:0}
  .stabs,.ticker,.d-only{display:none!important}
  .mapcol{padding:6px}
  .cstrip{display:flex;gap:8px;align-items:center;justify-content:space-between;flex:none;min-height:34px}
  .cstrip > span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mnav{display:flex;border-top:1px solid var(--line);background:var(--panel)}
  .mnav button{border-bottom:0;border-top:3px solid transparent;padding:9px 0}
  .mnav button[aria-pressed="true"]{color:var(--ink);border-top-color:var(--seal)}
  .scen{grid-template-columns:1fr 1fr;gap:6px}
  .scen .desc,.title-head p{display:none}
  .trow{grid-template-columns:4.4em 2.9em minmax(0,1fr) repeat(5,1.9em);font-size:12px;padding:0 6px;gap:3px}
  .trow .age{display:none}
}

/* 地圖 */
.m-land{fill:var(--land)} .m-sea{fill:var(--sea)} .m-river{fill:none;stroke:var(--river);stroke-width:4;stroke-linecap:round}
.m-rlabel{fill:var(--river);font:italic 700 15px var(--font-d);letter-spacing:.3em}
.m-zhou{fill:var(--ink);opacity:.09;font:900 44px var(--font-d);letter-spacing:.1em;text-anchor:middle}
.m-road{stroke:var(--road);stroke-width:1.6;stroke-dasharray:4 4}
.m-label{fill:var(--ink);font:700 14px var(--font-d);text-anchor:middle;paint-order:stroke;stroke:var(--land);stroke-width:4px;stroke-linejoin:round}
.m-troop{fill:var(--muted);font:500 11px var(--font-b);text-anchor:middle;paint-order:stroke;stroke:var(--land);stroke-width:3px}
.m-neutral{fill:var(--land);stroke:var(--muted);stroke-width:2}
.city{cursor:pointer}
.city rect.cs{stroke:var(--ink);stroke-width:1.5}
.m-sel{fill:none;stroke:var(--ink);stroke-width:2}
.m-me{fill:none;stroke:var(--seal);stroke-width:3;stroke-dasharray:5 3}
.m-flag{fill:var(--seal)}
.m-flagt{fill:var(--seal-ink);font:700 11px var(--font-d);text-anchor:middle}

/* 覆蓋卷 */
.modal{position:fixed;inset:0;background:var(--shade);z-index:35;display:grid;place-items:center;padding:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow:hidden}
.sheet{background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--seal);max-width:560px;width:100%;max-height:calc(100dvh - 32px);overflow:hidden;padding:16px 18px;display:flex;flex-direction:column;gap:10px;border-radius:2px}
.sheet > *{flex:none}
.sheet > .plist{flex:1}
.sheet.tall{height:min(680px,calc(100dvh - 32px))}
.sheet.wide{max-width:920px}
.choices{display:flex;flex-direction:column;gap:6px}
.crow{display:flex;justify-content:space-between;align-items:center;gap:10px;height:40px;text-align:left;border:1px solid var(--line);background:transparent;padding:0 12px;cursor:pointer;border-radius:2px;width:100%;margin-bottom:4px}
.crow:hover:not(:disabled){border-color:var(--ink);background:var(--land)}
.crow:disabled{opacity:.4;cursor:not-allowed}
.crow small{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:2px;z-index:40;max-width:calc(100vw - 32px);font-size:14px}
.busy{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:var(--shade);color:var(--seal-ink);font:700 20px var(--font-d);letter-spacing:.2em}
.hp{height:6px;background:var(--line);border-radius:1px;overflow:hidden}
.hp b{display:block;height:100%}

/* 戰場 */
.bt-head{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px}
.bt-sides{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bt-side{display:flex;flex-direction:column;gap:5px;min-width:0}
.bt-side h3{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unit{border:1px solid var(--line);padding:4px 7px;display:grid;gap:2px;background:var(--paper);border-radius:2px;text-align:left;width:100%}
.unit.active{border-color:var(--seal);box-shadow:inset 3px 0 0 var(--seal)}
.unit.target{cursor:pointer;border-color:var(--ink)}
.unit.target:hover{background:var(--land2)}
.unit.dead{opacity:.4}
.unit .top{display:flex;justify-content:space-between;gap:6px;white-space:nowrap}
.unit .top b{overflow:hidden;text-overflow:ellipsis}
.bt-log{list-style:none;margin:0;padding:6px 10px;border:1px solid var(--line);font-size:13px;background:var(--paper);height:66px;overflow:hidden}
.bt-log li{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.duel{border:1px solid var(--seal);padding:8px 12px;display:grid;gap:6px;background:var(--paper)}
.duel .hp{height:10px}
@media (max-width:640px){.unit small{display:none}.sheet{padding:12px 12px}.bt-log{height:46px}}
@media (prefers-reduced-motion: no-preference){.unit,.orow,.trow{transition:background .15s}}
</style>
</head>

    const id = await pickOfficer('登用誰？', list, 'cha', o => o.status === 'captive' ? '俘虜' : `親密 ${G.rel[o.id] || 0}`);
    if (id == null) return;
    const t = O(id);
    const rec = p.city === ci ? p : avail().sort((a, b) => b.cha - a.cha)[0];
    if (!rec) return toast('沒有可前往登用的武將。');
    if (t.status === 'captive') return lordCaptives([t]).then(render);
    const pr = recruitChance(rec, t, false);
    if (!(await ask(`派${rec.id === G.player ? '你自己' : rec.name}登用${t.name}？（成功率約 ${Math.round(pr*100)}%）`, '登用', '取消'))) return;
    if (rec.id === G.player) { if (!useAP(20)) return; } else rec.done = true;
    if (chance(pr)) { enlist(t, c.owner, ci); t.loyalty = rnd(65,90); log(`${t.name} 接受登用，加入我軍。`, true); }
    else log(`${t.name} 拒絕了登用。`, true);
  } else if (k === 'appoint') {
    const list = servants(c.owner, ci);
    const id = await pickOfficer(`任命${c.name}太守`, list, 'pol');
    if (id == null) return;
    if (isRuler(p) && p.city === ci && id !== p.id) return toast('主公所在之城由主公親自統領。');
    c.gov = id; log(`任命${O(id).name}為${c.name}太守。`, true);
  } else if (k === 'transfer') {
    const list = avail(); if (!list.length) return toast('沒有可調動的武將。');
    const id = await pickOfficer('調動誰？', list, 'lead');
    if (id == null) return;
    const dest = await choose(`${O(id).name} 調往`, forceCities(c.owner).filter(x => x.id !== ci).map(x => ({label:x.name, sub:`武將 ${servants(c.owner, x.id).length}`, value:x.id})));
    if (dest == null) return;
    const o = O(id); if (c.gov === id) c.gov = null; o.city = dest; o.done = true; fixGov(c); fixGov(C(dest));
    log(`${o.name} 調往${C(dest).name}。`, true);
  } else if (k === 'transport') {
    const dests = ADJ[ci].map(C).filter(x => x.owner === c.owner);
    if (!dests.length) return toast('沒有相鄰的己方城市。');
    const r = await transportSetup(c, dests);
    if (!r) return;
    const d = C(r.to); c[r.res] -= r.n; d[r.res] += r.n;
    log(`由${c.name}輸送${({troops:'士兵',gold:'金',food:'糧'})[r.res]} ${r.n} 到${d.name}。`, true);
  } else if (k === 'reward') {
    if (c.gold < 100) return toast('金不足（需 100）。');
    const list = servants(c.owner, ci).filter(o => o.id !== G.player);
    const id = await pickOfficer('賞賜誰？（金 100）', list, 'cha', o => `忠誠 ${o.loyalty}`);
    if (id == null) return;
    const o = O(id); const v = rnd(5, 12); o.loyalty = Math.min(100, o.loyalty + v); c.gold -= 100;
    log(`賞賜${o.name}，忠誠 +${v}（${o.loyalty}）。`, true);
  } else if (k === 'delegate') {
    c.delegate = !c.delegate; toast(c.delegate ? `${c.name}已委任，月底由太守自行處理內政。` : `${c.name}取消委任。`);
  }
  render();
}

const isMobile = () => matchMedia('(max-width: 899px)').matches;
UI.lists = {}; UI.pages = {};
function listBox(key, rows, head = '', empty = '沒有資料。') {

function fillList(el) {
  const key = el.dataset.list, L = UI.lists[key]; if (!L) return;

  const per = Math.max(1, Math.floor((body.clientHeight + 1) / rh));
  const pages = Math.ceil(rows.length / per);

function openBattle(B) {
  B.m = modal('', 'wide'); B.sheet = B.m.firstElementChild; B.all = [...B.att.units, ...B.def.units];
  B.sheet.addEventListener('click', e => {
    const b = e.target.closest('[data-a]'); if (!b) return;
    const a = b.dataset.a;
    if (B.pendYN) { if (a !== 'yes' && a !== 'no') return; const r = B.pendYN; B.pendYN = null; r(a === 'yes'); return; }
    if (B.pendDuel) { if (!['atk','def','crit','ok'].includes(a)) return; const r = B.pendDuel; B.pendDuel = null; r(a); return; }
    if (B.pendEnd && a === 'close') { const r = B.pendEnd; B.pendEnd = null; r(); return; }
    if (!B.pend) return;
    if (a === 'back') { B.pend.act = null; renderBattle(B); return; }
    if (a === 'unit') {
      if (!B.pend.act) return;
      const u = B.all[+b.dataset.i];
      if (!foeOf(B, B.pend.u).units.includes(u) || u.troops <= 0 || u.gone) return;
      if (B.pend.act === 'duel' && u.o.id < 0) return toast('守備兵無法單挑。');

    } else if (a === 'retreat' || a === 'auto') { const {res} = B.pend; B.pend = null; res({type:a}); }
    else { B.pend.act = a; renderBattle(B); }
  });
  renderBattle(B);
}
function unitCard(B, u) {

// 地圖放不下時放大一部分並可拖曳（拖曳只移動地圖，頁面不捲動）
function fitMap() {
  const svg = $('#map'); if (!svg) return;
  const box = svg.parentElement, cw = box.clientWidth, ch = box.clientHeight;
  if (!cw || !ch) return;
  const meet = Math.min(cw / 1000, ch / 720);
  if (meet >= 0.6) { svg.setAttribute('viewBox', '0 0 1000 720'); UI.vb = null; return; }
  const s = Math.min(0.9, Math.max(cw / 1000, ch / 720, meet * 1.6));
  const w = Math.min(1000, cw / s), h = Math.min(720, ch / s);
  let v = UI.vb;
  if (!v || Math.abs(v.w - w) > 1 || Math.abs(v.h - h) > 1) { const c = C(UI.sel ?? P().city); v = {x:c.x - w / 2, y:c.y - h / 2, w, h}; }
  v.x = clamp(v.x, 0, 1000 - w); v.y = clamp(v.y, 0, 720 - h); v.s = s; UI.vb = v;
  svg.setAttribute('viewBox', `${v.x} ${v.y} ${w} ${h}`);
}

document.addEventListener('pointermove', e => {
  if (!drag || !UI.vb) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (Math.abs(dx) + Math.abs(dy) > 6) drag.moved = true;
  if (!drag.moved) return;
  const v = UI.vb; v.x = clamp(drag.vx - dx / v.s, 0, 1000 - v.w); v.y = clamp(drag.vy - dy / v.s, 0, 720 - v.h);
  const svg = $('#map'); if (svg) svg.setAttribute('viewBox', `${v.x} ${v.y} ${v.w} ${v.h}`);
});

  const s = startLabel();
  app.innerHTML = `<div class="title wrap">
    <div class="title-head"><span class="big-seal">亂世錄</span><h1>三國亂世錄</h1><p class="muted">選擇任何一名武將，從在野之士、一介武將、一城太守到一方主公，走出自己的三國。</p>
      ${!repick && (hasAuto || hasSave) ? `<span class="row">${hasAuto ? '<button class="btn small" id="t-auto">繼續遊戲</button>' : ''}${hasSave ? '<button class="btn small" id="t-load">讀取存檔</button>' : ''}</span>` : ''}</div>
    ${repick ? `<p class="tctl"><b>${G.year}年${G.month}月</b>：選擇一名在世武將，繼續這個天下。</p>` : `<div class="scen">${SCENARIOS.map((sc, i) => `<button data-sc="${i}" aria-pressed="${i === G.sc}"><span class="muted num">${sc.year}年1月</span><b>${sc.name}</b><span class="desc">${sc.desc}</span></button>`).join('')}</div>`}
    <div class="row tctl">${repick ? '' : `<div class="tabs" title="武將壽命"><button data-life="hist" aria-pressed="${UI.life === 'hist'}">史實壽命</button><button data-life="long" aria-pressed="${UI.life === 'long'}">延長十五年</button></div>`}
      <div class="tabs">${[['all','全部'],['主公','君主'],['武將','武將'],['在野','在野']].map(([k, n]) => `<button data-tab="${k}" aria-pressed="${UI.tab === k}">${n}</button>`).join('')}</div>
      <input type="search" id="t-q" placeholder="搜尋姓名或勢力" value="${esc(UI.q)}" aria-label="搜尋武將"></div>
    <div class="listbox">${listBox('title', titleRows, titleHead(), '找不到符合的武將。')}</div>
    <div class="row tstart"><button class="btn primary" id="t-start" ${s.ok ? '' : 'disabled'}>${esc(s.text)}</button><span class="muted d-only" style="font-size:12px">${repick ? '' : `${S.name}・`}點選武將後開始；能力數值為本作自訂。</span></div>
  </div>`;
  fitLists(app);
}

// ───────── 存檔 ─────────
function saveTo(k) { try { localStorage.setItem(k, JSON.stringify(G)); return true; } catch (e) { return false; } }
function readSave(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function loadFrom(k) {
  try { const s = readSave(k); const g = s && JSON.parse(s); if (!g || !g.cities || g.player < 0) return false; G = g; G.party = G.party || []; G.ptroops = G.ptroops || 0; UI.sel = P().city; UI.vb = null; return true; }
  catch (e) { toast('存檔損壞，無法讀取。'); return false; }
}

render();
</script>
</body>
</html>
